<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | 3Dsofa</title>
    <meta name="robots" content="noindex,follow" />
    <meta http-equiv="refresh" content="5; url=/" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, #1a1a1a, #000);
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        .box {
            max-width: 520px;
            width: 100%;
            padding: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
        }
        h1 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 12px;
        }
        p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        a {
            color: #2ecc71;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }
        a:hover {
            border-bottom-color: #2ecc71;
        }
        .btn {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 18px;
            border-radius: 20px;
            background: #2ecc71;
            color: #000;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>404 — Page Not Found</h1>
        <p>The page doesn’t exist or has moved. You will be redirected to the homepage in 5 seconds.</p>
        <a class="btn" href="/">Go to homepage</a>
    </div>
</body>
</html>
