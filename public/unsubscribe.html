<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe | 3Dsofa</title>
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://3dsofa.com/unsubscribe.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            overflow: hidden;
            background: #050706;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
        }
        .video-bg,
        .video-bg::after {
            position: fixed;
            inset: 0;
        }
        .video-bg { z-index: -1; }
        .video-bg::after {
            content: "";
            background: rgba(0, 0, 0, 0.45);
        }
        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .panel {
            width: min(420px, 100%);
            padding: 36px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            background: rgba(8, 12, 10, 0.68);
            backdrop-filter: blur(18px);
            text-align: center;
        }
        h1 { margin-bottom: 22px; font-size: 2rem; font-weight: 400; }
        input,
        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 999px;
            font: inherit;
        }
        input { padding: 0 18px; }
        .actions { display: flex; gap: 12px; margin-top: 12px; }
        button { cursor: pointer; padding: 0 18px; }
        .unsubscribe { background: #ec5c4e; color: #fff; }
        .return { background: #58db7a; color: #071009; }
        @media (max-width: 520px) {
            .panel { padding: 28px 20px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="video-bg" aria-hidden="true">
        <video autoplay muted loop playsinline preload="metadata">
            <source src="/media/videos/3dsofa-contact.mp4" type="video/mp4">
        </video>
    </div>
    <main>
        <section class="panel" aria-labelledby="unsubscribe-title">
            <h1 id="unsubscribe-title">Unsubscribe?</h1>
            <form action="#" method="post">
                <input type="email" name="email" autocomplete="email" placeholder="Enter your email" aria-label="Email" required>
                <div class="actions">
                    <button class="unsubscribe" type="submit">Unsubscribe</button>
                    <button class="return" type="button" onclick="window.location.href='/'">Back to site</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
